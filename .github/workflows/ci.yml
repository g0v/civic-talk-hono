name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4.3.0
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      # voidzero-dev/setup-vp v1.1.0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@e1609b468742ba9232ce5e12b3a77bdf14495277
        with:
          cache: true

      - name: Install dependencies (frozen lockfile)
        run: vp install --frozen-lockfile

      - name: Generate Cloudflare binding types
        run: vp run cf-typegen

      - name: Check types
        run: vp check --no-fmt --no-lint

      - name: Test（l10n key 同步）
        run: vp test

      - name: Build (CSS + server + client)
        run: vp run build
