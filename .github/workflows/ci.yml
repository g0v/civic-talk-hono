name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安裝依賴
        run: npm ci

      - name: 型別檢查
        run: npx vp check --no-fmt --no-lint

      - name: 自動化測試
        run: npx vp test

      - name: 建置
        run: npx vp run build
